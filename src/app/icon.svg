<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Couette: a folded blanket corner on the Luna Rouge background -->
  <rect width="512" height="512" rx="116" fill="#b0413e"/>
  <!-- fold depth -->
  <rect x="150" y="150" width="212" height="212" rx="26" fill="#d9c19a"
        transform="rotate(45 256 256) translate(-14 -14)"/>
  <!-- blanket -->
  <rect x="150" y="150" width="212" height="212" rx="26" fill="#f2e3c6"
        transform="rotate(45 256 256)"/>
  <!-- hem stitching -->
  <rect x="182" y="182" width="148" height="148" rx="18" fill="none"
        stroke="#b0413e" stroke-width="9" stroke-dasharray="26 22"
        stroke-linecap="round" transform="rotate(45 256 256)"/>
  <!-- small knit rows in the folded corner -->
  <g stroke="#d9c19a" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="196" x2="236" y2="216"/>
    <line x1="292" y1="204" x2="264" y2="232"/>
    <line x1="158" y1="262" x2="158" y2="278"/>
  </g>
</svg>
